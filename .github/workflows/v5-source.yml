name: Materialize Forge V5 source

on:
  push:
    branches: [main]
    paths:
      - app-v5-core.txt
      - .github/workflows/v5-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode V5 source
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          encoded = pathlib.Path('app-v5-core.txt').read_text().strip()
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          pathlib.Path('app-v5-core.js').write_text(source)
          PY
      - name: Validate JavaScript
        run: node --check app-v5-core.js
      - name: Commit generated source
        run: |
          if git diff --quiet -- app-v5-core.js; then
            exit 0
          fi
          git config user.name "Forge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app-v5-core.js
          git commit -m "Materialize Forge v5 source [skip ci]"
          git push
