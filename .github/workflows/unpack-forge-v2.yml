name: Unpack Forge v2

on:
  push:
    branches: [forge-v2-rebuild]
    paths:
      - ".forge-payload/UNPACK"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-v2-rebuild

      - name: Unpack rebuilt project
        run: |
          cat .forge-payload/part00 .forge-payload/part01 .forge-payload/part02 .forge-payload/part03 > /tmp/forge.tar.gz.b64
          base64 --decode /tmp/forge.tar.gz.b64 > /tmp/forge.tar.gz
          tar -xzf /tmp/forge.tar.gz -C .
          rm -rf .forge-payload
          rm -f .github/workflows/unpack-forge-v2.yml

      - name: Commit rebuilt project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Forge Studio v2" || exit 0
          git push origin forge-v2-rebuild
