name: Package Forge v4.7

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build complete deployment bundle
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            ./ dist/

      - name: Upload Forge bundle
        uses: actions/upload-artifact@v4
        with:
          name: forge-v47-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
